<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Murder Mystery: 7 ночей</title>
<style>
:root{--bg:#07070d;--card:#10111c;--c1:#00f0ff;--c2:#ff2e63;--c3:#7c5cff;--tx:#e8eaf6;--mut:#7f84a8;--line:#2a2c47}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(900px 500px at 12% 8%,#3a0f3f66,transparent),radial-gradient(800px 500px at 92% 92%,#00364466,transparent),var(--bg)}
.screen{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:16px;overflow:auto}
.screen.active{display:flex}
.card{width:min(480px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 0 50px #7c5cff22,inset 0 0 0 1px #ffffff08}
h1{margin:0 0 4px;font-size:32px;letter-spacing:3px;text-align:center;color:#fff;text-shadow:0 0 6px var(--c2),0 0 26px var(--c2)}
h2{margin:0 0 10px;font-size:20px;color:#fff;text-shadow:0 0 12px var(--c3)}
.sub{text-align:center;color:var(--mut);margin:0 0 20px;font-size:14px}
label{display:block;margin:14px 0 6px;color:var(--mut);font-size:13px}
input[type=text]{width:100%;padding:12px 14px;background:#0a0b14;border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:16px;outline:none}
input[type=text]:focus{border-color:var(--c1);box-shadow:0 0 14px #00f0ff44}
button{cursor:pointer;border:1px solid var(--c3);background:#171a30;color:#fff;padding:12px 16px;border-radius:10px;font-size:15px;font-family:inherit;transition:.15s}
button:hover:not(:disabled){box-shadow:0 0 18px var(--c3);transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.primary{background:linear-gradient(135deg,#ff2e63,#7c5cff);border-color:transparent;font-weight:bold;box-shadow:0 0 18px #ff2e6355}
.cyan{border-color:var(--c1);box-shadow:0 0 12px #00f0ff33}
.full{width:100%;margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.av{width:96px;height:96px;border-radius:50%;border:3px solid var(--c1);box-shadow:0 0 22px var(--c1);object-fit:cover;display:block;margin:0 auto 14px;background:#000}
.err{color:var(--c2);min-height:20px;margin-top:10px;font-size:14px;text-align:center}
.chip{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.chip img{width:46px;height:46px;border-radius:50%;border:2px solid var(--c1);box-shadow:0 0 10px var(--c1)}
.chip b{flex:1;font-size:18px}.chip button{flex:0;padding:8px 10px;font-size:12px}
.code{font-size:34px;letter-spacing:8px;text-align:center;color:var(--c1);text-shadow:0 0 16px var(--c1);margin:4px 0 8px;font-weight:bold}
.plist{display:grid;gap:8px;margin:10px 0}
.pl{display:flex;align-items:center;gap:12px;background:#0a0b14;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.pl img{width:34px;height:34px;border-radius:50%;border:2px solid var(--c3)}
.set{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-top:6px}
.set input[type=range]{grid-column:1/3;width:100%;accent-color:var(--c2)}
.set span{color:var(--c1);font-weight:bold}
.note{color:var(--mut);font-size:13px;margin:0 0 8px}
#game{padding:0;display:none}
#game.active{display:block}
#cv{display:block;width:100%;height:100%;cursor:crosshair}
#lobbyPanel{position:absolute;left:14px;top:58px;width:min(370px,calc(100% - 28px));max-height:calc(100% - 76px);overflow:auto;z-index:5;background:#10111cee;padding:20px}
#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:none;gap:14px;background:#0b0c16cc;border:1px solid var(--line);border-radius:12px;padding:8px 18px;font-size:16px;white-space:nowrap}
#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#0b0c16cc;border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-size:14px;text-align:center;max-width:92vw}
#banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,8vw,84px);font-weight:bold;pointer-events:none;opacity:0;text-shadow:0 0 30px currentColor}
#banner.show{animation:ban 3s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;font-weight:bold;color:#fff;text-shadow:0 0 40px var(--c2);pointer-events:none}
#count b{font-size:clamp(90px,22vw,220px);line-height:1}
#count small{font-size:20px;letter-spacing:2px;color:var(--mut);text-shadow:none}
#count.pulse b{animation:pl 1s ease-out}
@keyframes pl{from{transform:scale(1.5);opacity:.2}to{transform:scale(1);opacity:1}}
#toasts{position:absolute;top:60px;right:14px;display:grid;gap:6px;pointer-events:none}
.toast{background:#150a14ee;border:1px solid var(--c2);color:#ffd0dc;padding:8px 14px;border-radius:10px;font-size:14px}
#status{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:10px;background:#0b0c16ee;border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:14px;max-width:94vw;box-shadow:0 0 18px #000a}
#status i{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;flex:none}
#status.info{color:#ffd23f}#status.ok{color:#3dff9a}#status.err{color:var(--c2)}
#status span{color:var(--tx)}
#endTitle{font-size:30px;text-align:center;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){#banner.show,#count.pulse b{animation:none;opacity:1}}

:root{--bg:#0b0d0a;--card:#14160f;--c1:#d2a35c;--c2:#a8443a;--c3:#6b7a4c;--tx:#e6dfd0;--mut:#8a8572;--line:#2f3224}
body{background:radial-gradient(900px 500px at 15% 10%,#2a1c0d55,transparent),radial-gradient(800px 500px at 90% 90%,#0f1f1355,transparent),var(--bg)}
h1,h2,.code,#banner,#count,#endTitle{text-shadow:0 2px 10px #000;font-family:Georgia,"Times New Roman",serif}
.card{box-shadow:0 10px 40px #000a}
button:hover:not(:disabled){box-shadow:0 0 12px #0009}
.primary{background:linear-gradient(#933d32,#6b2b25);box-shadow:none}
.cyan{box-shadow:none}
input[type=text]:focus{box-shadow:0 0 10px #d2a35c33}
.av,.chip img{box-shadow:0 0 10px #000}
#status.info{color:#d2a35c}#status.ok{color:#9bb36a}
#actPanel{position:absolute;right:14px;top:58px;width:min(310px,calc(100% - 28px));max-height:calc(100% - 140px);overflow:auto;z-index:5;display:none;padding:16px;background:#14160fee}
.pick{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;padding:6px 10px;text-align:left}
.pick img{width:26px;height:26px;border-radius:50%}
.sel{border-color:#d2a35c!important;background:#2b2518!important}
.abrow{display:flex;gap:6px;flex-wrap:wrap}.abrow button{flex:1;padding:8px;font-size:13px}
select{width:100%;padding:10px;background:#0a0b14;color:var(--tx);border:1px solid var(--line);border-radius:10px;font-size:15px}
#rs{display:none;position:fixed;inset:0;z-index:60;background:#000b;align-items:center;justify-content:center;padding:16px;overflow:auto}
.rrow{display:grid;grid-template-columns:22px 1.2fr 1.4fr 3em;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.rrow input[type=range]{width:100%;accent-color:#a8443a}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{text-shadow:0 2px 10px #000,0 0 10px #a8443a44}50%{text-shadow:0 2px 10px #000,0 0 28px #a8443aaa}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes popC{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes bgm{from{background-position:0 0,100% 100%,0 0}to{background-position:80px 40px,calc(100% - 80px) calc(100% - 40px),0 0}}
@keyframes selp{0%,100%{box-shadow:0 0 0 0 #d2a35c55}50%{box-shadow:0 0 0 5px #d2a35c00}}
@keyframes fin{from{opacity:0}to{opacity:1}}
body{animation:bgm 14s ease-in-out infinite alternate}
.screen.active>.card,#rs .card{animation:rise .5s ease both}
h1{animation:glow 4s ease-in-out infinite}
.av{animation:floaty 3.5s ease-in-out infinite}
#actPanel{animation:slideIn .4s ease both}
.toast{animation:toastIn .35s ease both}
#status{animation:popC .3s ease both}
.pick.sel{animation:selp 1.6s infinite}
button{transition:transform .15s,box-shadow .2s,background .2s}
button:active:not(:disabled){transform:scale(.95)}
.pl,.pick{transition:transform .2s,border-color .2s}.pl:hover,.pick:hover:not(:disabled){transform:translateX(4px)}
#game.active #cv{animation:fin .9s ease both}
#end.active #endTitle{animation:rise .7s ease both}
#gear{position:fixed;right:14px;bottom:14px;z-index:80;width:46px;height:46px;border-radius:50%;padding:0;font-size:22px;background:#14160fee;transition:transform .6s,box-shadow .2s}
#gear:hover{transform:rotate(120deg)}
#sp{position:fixed;right:14px;bottom:70px;z-index:80;width:270px;padding:16px;opacity:0;pointer-events:none;transform:translateY(14px) scale(.95);transition:opacity .25s,transform .25s;animation:none!important}
#sp.open{opacity:1;pointer-events:auto;transform:none}
#game{overflow:hidden}
#cv{transition:transform 1.2s cubic-bezier(.4,0,.2,1)}
#cv.d3{transform:perspective(1000px) rotateX(50deg) scale(1.7);transform-origin:50% 72%}
#hz{position:absolute;left:0;right:0;top:0;height:38%;background:linear-gradient(#050605 8%,transparent);pointer-events:none;opacity:0;transition:opacity 1.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#sk{display:none;position:fixed;inset:0;z-index:60;background:#000b;align-items:center;justify-content:center;padding:16px;overflow:auto}
#sk .card{animation:rise .4s both}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:12px 0}
.skg button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;font-size:12px}
.skg canvas{background:#0a0b14;border-radius:8px}
#c3{position:absolute;inset:0;width:100%;height:100%;display:none}
#c3{cursor:grab}#c3:active{cursor:grabbing}
#game.r3 #c3{display:block}#game.r3 #cv{display:none}
button{touch-action:manipulation}
#cv,#c3{touch-action:none;-webkit-user-select:none;user-select:none}
#joy,.tb{display:none}
#joy{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);touch-action:none;z-index:6}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(210,163,92,.55);border:2px solid rgba(255,255,255,.35);pointer-events:none}
.tb{position:absolute;width:66px;height:66px;border-radius:50%;font-size:26px;padding:0;background:rgba(20,22,15,.78);touch-action:none;z-index:6}
#tbA{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#tbQ{right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#tbD{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#game.tplay #joy{display:block}
#game:not(.tplay) .tb{display:none!important}
#lobbyPanel.min>*:not(h2),#actPanel.min>*:not(h2){display:none}
#lobbyPanel h2,#actPanel h2{cursor:pointer}
/* адаптация под телефоны и узкие окна */
@media (max-width:760px),(max-height:520px){
 .card{padding:18px}
 h1{font-size:26px}
 #hud{font-size:13px;padding:5px 10px;gap:8px;top:6px}
 #hint{top:42px;bottom:auto;font-size:12px;padding:6px 10px;max-width:92vw}
 #toasts{top:78px;right:8px}.toast{font-size:12px;padding:6px 10px}
 #status{font-size:12px;top:6px;padding:6px 12px}
 body.touch #gear{top:8px;bottom:auto;right:8px;width:38px;height:38px;font-size:18px}
 body.touch #sp{top:54px;bottom:auto;right:8px;width:min(270px,calc(100% - 16px))}
 #lobbyPanel{left:8px;top:44px;width:min(370px,calc(100% - 16px));max-height:calc(100% - 52px);padding:14px}
 #actPanel{left:8px;right:8px;top:84px;width:auto;max-height:36%;padding:10px}
 #actPanel h2{font-size:15px;margin-bottom:6px}.pick{padding:4px 8px;font-size:13px}
 #rs,#sk{align-items:flex-start}
}
@media (max-height:520px) and (min-width:761px){#actPanel{left:auto;right:8px;width:340px;max-height:calc(100% - 210px)}}
</style>
</head>
<body>
<div id="status" class="info"><i></i><span></span></div>

<!-- 1. Регистрация -->
<div id="auth" class="screen active"><div class="card">
  <h1>Тихий лес</h1><p class="sub">Один маньяк. Остальные хотят дожить до утра.</p>
  <img id="avPrev" class="av" alt="Аватар">
  <div class="row">
    <button id="btnGen" class="cyan">Сгенерировать</button>
    <button id="btnUp">Загрузить своё</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <label for="nick">Ник (2–14 символов)</label>
  <input type="text" id="nick" maxlength="14" autocomplete="off" placeholder="Например, Тень">
  <button id="btnEnter" class="primary full">Войти в игру</button>
  <div class="err" id="authErr"></div>
</div></div>

<!-- 2. Меню -->
<div id="menu" class="screen"><div class="card">
  <div class="chip"><img id="mAv" alt=""><b id="mNick"></b><button id="btnLogout">Сменить профиль</button></div>
  <button id="btnCreate" class="primary full" style="margin-top:0">Создать лобби</button>
  <label for="joinCode">Код лобби</label>
  <div class="row"><input type="text" id="joinCode" maxlength="5" placeholder="ABCDE" autocomplete="off" style="text-transform:uppercase"><button id="btnJoin" class="cyan" style="flex:0 0 auto">Присоединиться</button></div>
  <button id="btnSkin" class="full">Скин ножа</button>
  <button id="btnOffline" class="full">Играть офлайн с ботами</button>
  <div class="err" id="menuErr"></div>
</div></div>

<!-- Игровая сцена (лобби у костра + раунд) -->
<div id="game" class="screen">
  <canvas id="cv"></canvas><canvas id="c3"></canvas>
  <div id="lobbyPanel" class="card">
    <h2 id="lpH">Лобби у костра <small>▾</small></h2>
    <p class="note">Игроки сами идут к костру и садятся у своих домиков. Домиков и мест у костра ровно столько, сколько игроков.</p>
    <div class="code" id="lCode">-----</div>
    <div class="row" id="netRow"><button id="btnCopy">Копировать код</button><button id="btnLink">Копировать ссылку</button></div>
    <button id="btnBot" class="full" style="display:none">+ Добавить бота</button>
    <div class="plist" id="lPlayers"></div>
    <div class="set">
      <label for="sMin" style="margin:8px 0 0">Минимум игроков для старта</label><span id="vMin"></span>
      <input type="range" id="sMin" min="3" max="10" step="1">
      <label for="sTime" style="margin:8px 0 0">Длительность дня (сек)</label><span id="vTime"></span>
      <input type="range" id="sTime" min="30" max="120" step="5">
      <label for="sSpeed" style="margin:8px 0 0">Скорость ходьбы</label><span id="vSpeed"></span>
      <input type="range" id="sSpeed" min="80" max="220" step="10">
      <label for="sVis" style="margin:8px 0 0">Радиус обзора в темноте</label><span id="vVis"></span>
      <input type="range" id="sVis" min="100" max="450" step="10">
      <label for="sMan" style="margin:8px 0 0">Количество маньяков</label><span id="vMan"></span>
      <input type="range" id="sMan" min="1" max="3" step="1">
    </div>
    <div class="note" id="mapInfo" style="margin-top:10px"></div>
    <button id="btnRS" class="full" style="display:none">⚙ Настройки комнаты</button>
    <button id="btnStart" class="primary full">Старт</button>
    <button id="btnLeave" class="full">Покинуть лобби</button>
  </div>
  <div id="actPanel" class="card"></div>
  <div id="hud"><span id="hDay"></span><span id="hRole"></span><span id="hTime"></span><span id="hAlive"></span></div>
  <div id="joy"><i></i></div><button class="tb" id="tbA" aria-label="Удар">⚔</button><button class="tb" id="tbQ" aria-label="Невидимка">👻</button><button class="tb" id="tbD" aria-label="Прыжок">⤴</button>
  <div id="hint"></div>
  <div id="count"><small>Роли будут выданы через</small><b id="cnum"></b></div>
  <div id="banner"></div><div id="toasts"></div>
</div>

<!-- Конец раунда -->
<div id="end" class="screen"><div class="card">
  <div id="endTitle"></div><p class="sub" id="endReason"></p>
  <div class="plist" id="endList"></div>
  <button id="btnBack" class="primary full">Вернуться к костру</button>
</div></div>

<div id="rs"><div class="card" id="rsBody"></div></div>
<div id="sk"><div class="card" id="skBody"></div></div>
<button id="gear" aria-label="Настройки">⚙</button>
<div id="sp" class="card"><h2>Настройки</h2><label>Режим картинки</label><div class="row"><button id="v2d">2D</button><button id="v3d">3D</button></div><label>Туман в 3D: <b id="fogV">100%</b></label><input type="range" id="fogR" min="0" max="200" step="10" value="100" style="width:100%;accent-color:#a8443a">
<label>Камера в 3D</label><div class="row"><button id="vtp">От 3-го лица</button><button id="vfp">От 1-го лица</button></div><button id="fsb" class="full">⛶ Полный экран</button><label>Язык</label><div class="row"><button id="lru">Русский</button><button id="lua">Українська</button></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const log=(...a)=>console.log('[MM]',...a),warn=(...a)=>console.warn('[MM]',...a),err=(...a)=>console.error('[MM]',...a);

// ================= PEERJS: надёжная загрузка =================
// Пробуем три CDN по очереди. Если не загрузился ни один — показываем понятную ошибку.
const CDNS=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
function loadPeerJS(){return new Promise((res,rej)=>{let i=0;
 const next=()=>{if(window.Peer){log('PeerJS готов');return res()}
  if(i>=CDNS.length)return rej(new Error('PeerJS не загрузился ни с одного CDN'));
  const s=document.createElement('script');s.src=CDNS[i++];log('Загрузка PeerJS:',s.src);
  s.onload=next;s.onerror=()=>{err('CDN недоступен:',s.src);s.remove();next()};document.head.appendChild(s)};next()})}
const peerReady=loadPeerJS();peerReady.catch(e=>err(e));
// Свой сервер: new Peer(id,{host:'your.host',port:443,path:'/',secure:true,...})
const PEER_OPTS={host:'0.peerjs.com',port:443,path:'/',secure:true,key:'peerjs',debug:2,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
const PFX='mmg-';
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:5},()=>CODE_CH[Math.random()*CODE_CH.length|0]).join('');
function errText(e){const t=e&&e.type;
 const m={network:'Нет связи с сервером PeerJS. Проверьте интернет, VPN и блокировщики',
 'server-error':'Сервер PeerJS вернул ошибку, попробуйте позже','socket-error':'Ошибка соединения с сервером PeerJS',
 'socket-closed':'Соединение с сервером PeerJS закрыто','browser-incompatible':'Браузер не поддерживает WebRTC',

function tryCreate(n){
 code=genCode();setStatus('Создание комнаты…');log('Peer ID:',PFX+code,'сервер:',PEER_OPTS.host+':'+PEER_OPTS.port,'попытка',n+1);
 let opened=false,p;
 try{p=peer=new Peer(PFX+code,PEER_OPTS)}catch(e){err('new Peer упал:',e);return startOffline('ошибка инициализации Peer')}
 const bad=why=>{if(peer!==p||opened)return;clearTimeout(to);startOffline(why)};
 const to=setTimeout(()=>bad('сервер не отвечает 10 с'),10000);
 p.on('open',id=>{if(peer!==p)return;opened=true;clearTimeout(to);log('Хост открыт, ID:',id);
  me.id=hostId=id;players={};players[id]=me_();phase='lobby';setBusy(false);showLobby();setStatus('Лобби создано! Ваш код: '+code,'ok')});
 p.on('connection',c=>{if(peer!==p)return;log('Входящее соединение:',c.peer);
  c.on('data',d=>hostMsg(c,d));c.on('close',()=>{log('Игрок отключился:',c.peer);removePlayer(c.peer)});c.on('error',e=>err('conn error',c.peer,e))});
 p.on('disconnected',()=>{if(peer!==p)return;warn('Потеряна связь с сигнальным сервером');
  if(!opened)return bad('нет связи с сервером');setStatus('Связь с сервером потеряна, переподключаемся…');try{p.reconnect()}catch(e){err(e)}});
 p.on('error',e=>{if(peer!==p)return;err('Peer error:',e.type,e);
  if(e.type==='unavailable-id'&&n<4){clearTimeout(to);peer=null;try{p.destroy()}catch(x){}return tryCreate(n+1)}
  if(!opened)return bad(errText(e));setStatus(errText(e),'err')});
}
function hostMsg(c,d){
 if(d.t!=='in')log('← от',c.peer,d.t);
 if(d.t==='join'){
  if(players[c.peer])return;
  if(phase!=='lobby'||Object.keys(players).length>=MAXP){c.send({t:'deny',m:phase!=='lobby'?'Игра уже идёт':'Лобби заполнено'});return}
  players[c.peer]={id:c.peer,nick:String(d.nick||'Игрок').slice(0,14),avatar:d.avatar,skin:String(d.skin||'knife'),alive:true,conn:c};broadcastLobby();
 }else if(d.t==='act')applyAct(c.peer,d);
 else if(d.t==='in'){const p=players[c.peer];if(p&&p.alive&&phase==='play'){let x=+d.x||0,y=+d.y||0;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}p.in={x,y};if(typeof d.fa==='number')p.fa=d.fa}}
}

 let p;try{p=peer=new Peer(PEER_OPTS)}catch(e){err('new Peer упал:',e);return fail('Ошибка инициализации PeerJS')}

function clientMsg(d){

 if(d.t==='deny')fail(d.m);

  const old=players;players={};d.list.forEach(p=>players[p.id]=Object.assign(old[p.id]||{},p));
  if(cur==='menu'){clearTimeout(joinTimer);setBusy(false);showLobby();setStatus('Подключено! Код лобби: '+code,'ok')}else renderLobby()}

  curMap=d.map;mapKey='';buildMap(pl().length);reseat();S={ph:'day',day:1,t:settings.time,stage:'plan'};enterGame()}
 else if(d.t==='st'){if(S.ph!==d.ph)G.choice={};S.ph=d.ph;S.stage=d.sg;S.day=d.day;S.t=d.tl;
  d.p.forEach(([id,x,y,a,st,hp,inv,fa,mk])=>{const q=players[id];if(!q)return;if(q.tx===undefined){q.x=x;q.y=y}
   q.tx=x;q.ty=y;q.alive=!!a;q.st=st;q.hp=hp;q.inv=!!inv;q.fa=fa/100;q.mk=!!mk})}
 else if(d.t==='mu'){G.mu=d.mu;addFx({k:'msg',m:'🧬 Новая мутация: '+MUT[d.nw]})}
 else if(d.t==='insp'){G.known[d.id]=d.role;addFx({k:'msg',m:'🔍 '+(players[d.id]?players[d.id].nick:'?')+' — '+RN[d.role]})}
 else if(d.t==='fx')addFx(d);
 else if(d.t==='end'){phase='lobby';for(const id in d.roles)if(players[id])players[id].role=d.roles[id];showEnd(d.w,d.reason)}
}

// ---- кик (только хост, пока игра не началась): боты и игроки
function kickPlayer(id){
 if(!isHost||phase!=='lobby'||id===me.id)return;const p=players[id];if(!p)return;log('Кик:',p.nick);
 if(!p.bot&&p.conn){try{p.conn.send({t:'kicked'})}catch(e){}setTimeout(()=>{try{p.conn.close()}catch(e){}},200)}
 delete players[id];broadcastLobby();
}
function renderLobby(){
 if(phase!=='play')seatAll();
 $('#lCode').textContent=offline?'ОФЛАЙН':code;$('#netRow').style.display=offline?'none':'flex';$('#btnBot').style.display=offline?'block':'none';
 $('#btnRS').style.display=isHost?'block':'none';
 $('#mapInfo').textContent='Карта: '+(settings.map==='random'?'случайная':MAPS[settings.map].n)+' · Маньяк'+ROLEKEYS.filter(k=>settings.roles[k]&&settings.roles[k].on).map(k=>', '+RN[k]+' '+settings.roles[k].p+'%').join('');
 if($('#rs').style.display==='flex')renderRS();
 $('#lPlayers').innerHTML='';
 pl().forEach(p=>{const d=document.createElement('div');d.className='pl';
  const i=document.createElement('img');i.src=p.avatar;const n=document.createElement('b');n.textContent=p.nick+(p.id===hostId?'  ★':'');n.style.flex=1;
  d.append(i,n);
  if(isHost&&p.id!==me.id&&phase==='lobby'){const kb=document.createElement('button');kb.textContent='✕ Кикнуть';kb.style.cssText='flex:0;padding:6px 10px;font-size:12px;white-space:nowrap';kb.onclick=()=>kickPlayer(p.id);d.append(kb)}
  $('#lPlayers').append(d)});
 for(const k in $s){$s[k].value=settings[k];$s[k].disabled=!isHost}
 $('#vMin').textContent=settings.min;$('#vTime').textContent=settings.time+' с';$('#vSpeed').textContent=settings.speed;$('#vVis').textContent=settings.vision;$('#vMan').textContent=settings.man;
 const n=pl().length,b=$('#btnStart');b.disabled=!isHost||n<settings.min;
 b.textContent=isHost?`Старт (${n}/${settings.min})`:'Ждём, пока хост нажмёт «Старт»…';
}
for(const k in $s)$s[k].oninput=()=>{if(!isHost)return;settings[k]=+$s[k].value;broadcastLobby()};
const copy=(t,btn,orig)=>{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{btn.textContent='Скопировано ✓'},()=>{btn.textContent='Код: '+code});setTimeout(()=>btn.textContent=orig,1600)};
$('#btnCopy').onclick=()=>copy(code,$('#btnCopy'),'Копировать код');
$('#btnLink').onclick=()=>copy(lobbyLink(),$('#btnLink'),'Копировать ссылку');
$('#btnLeave').onclick=()=>leave();
$('#btnBack').onclick=()=>showLobby();

// ---- старт: отсчёт -> роли -> цикл дней
function onCount(n){phase='countdown';show('game');const c=$('#count');
 if(n<=0){c.style.display='none';return}
 c.style.display='flex';$('#cnum').textContent=n;c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse')}
function abort(){phase='lobby';$('#count').style.display='none';showLobby();setStatus('Старт отменён: не хватает игроков','err')}
function startGame(){
 if(!isHost||phase!=='lobby'||pl().length<settings.min)return;
 phase='countdown';let n=5;log('Старт: отсчёт');broadcast({t:'count',n});onCount(n);clearInterval(cdTimer);
 cdTimer=setInterval(()=>{n--;if(n<=0){clearInterval(cdTimer);beginRound();return}broadcast({t:'count',n});onCount(n)},1000);
}
function beginRound(){
 const ids=Object.keys(players);
 if(ids.length<Math.max(3,settings.min)){broadcast({t:'abort'});abort();return}
 const n=Math.max(1,Math.min(settings.man||1,Math.floor((ids.length-1)/2)));   // число маньяков зависит от числа игроков
 const sp=[];for(const k of ROLEKEYS){const c=settings.roles[k];if(c&&c.on&&Math.random()*100<c.p)sp.push(k)}shuffle(sp);
 const sh=shuffle(ids.slice());
 sh.forEach((id,i)=>Object.assign(players[id],{role:i<n?'murderer':(sp[i-n]||'civ'),vote:null,shield:null,shot:null,plan:null,invT:0,pauseT:0,mu:{},cd:3,cdI:0,cdL:0,slowT:0,frT:0,dashT:0,atkT:0,in:{x:0,y:0}}));
 const keys=Object.keys(MAPS);curMap=MAPS[settings.map]?settings.map:keys[Math.random()*keys.length|0];mapKey='';buildMap(ids.length);reseat();
 S={ph:'day',day:1,t:settings.time,stage:'plan'};phase='play';log('Раунд начался. Карта:',curMap,'маньяков:',n);
 const mates=sh.slice(0,n);
 for(const p of pl())if(p.conn)p.conn.send({t:'start',role:p.role,map:curMap,mates:p.role==='murderer'?mates:[]});
 const my=players[me.id];G={role:my.role,mu:{},choice:{},known:{},mates:my.role==='murderer'?mates:[]};
 enterGame();clearInterval(loop);loop=setInterval(tick,33);
}

// ---- хост: автоматическое движение и смена дня/ночи
function goPath(p,pts,after){p.path=pts.map(a=>a.slice());p.st=0;p.after=after}
const MG=80,VDELAY=10,PLAN=15,R_P=12,nightLen=()=>Math.max(50,Math.min(100,Math.round(settings.time*.9))),huntSp=()=>Math.max(settings.speed*1.3,140);
const rand=a=>a[Math.random()*a.length|0],d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),MUTK=Object.keys(MUT);
const inHouse=(p,h)=>!!h&&p.x>h.x+10&&p.x<h.x+h.w-10&&p.y>h.y+10&&p.y<h.y+h.h-10;
function blocked(x,y,r){
 if(x<r+MG||y<r+MG||x>WW-r-MG||y>WH-r-MG)return true;
 if((x-FIRE[0])**2+(y-FIRE[1])**2<(30+r)**2)return true;
 for(const h of HOUSES)for(const w of (h.walls||[])){const cx=Math.max(w[0],Math.min(x,w[0]+w[2])),cy=Math.max(w[1],Math.min(y,w[1]+w[3]));if((x-cx)**2+(y-cy)**2<r*r)return true}
 for(const o of OBS)if((x-o[0])**2+(y-o[1])**2<(o[2]+r)**2)return true;
 return false}
// куда игроку нужно дойти (стрелка-указатель)
function navTarget(m){
 if(phase!=='play'||!m.alive||S.ph==='duel')return null;const h=HOUSES[m.hi];if(!h)return null;
 if(S.ph==='day')return Math.hypot(m.x-FIRE[0],m.y-FIRE[1])>190?{x:FIRE[0],y:FIRE[1],l:'к костру'}:null;
 if(G.role==='murderer'&&S.stage==='act'){const v=G.choice.tg&&players[G.choice.tg];if(v&&v.alive&&HOUSES[v.hi])return {x:HOUSES[v.hi].dout[0],y:HOUSES[v.hi].dout[1],l:'к жертве'};return null}
 if(inHouse(m,h))return null;
 return Math.hypot(m.x-h.dout[0],m.y-h.dout[1])>46?{x:h.dout[0],y:h.dout[1],l:'домой'}:{x:h.din[0],y:h.din[1],l:'домой'};
}
function startDay(){S.ph='day';S.stage='plan';S.t=settings.time;G.choice={};
 for(const p of pl()){p.vote=null;p.invT=0;p.plan=null;p.shot=null;p.insp=false;p.pauseT=0;if(p.alive&&p.bot){const h=HOUSES[p.hi];goPath(p,[h.din,h.dout,h.seat],1)}}
 if(S.day>1)grantMut()}
function startNight(){S.ph='night';S.stage='plan';S.t=S.nt0=nightLen();G.choice={};S.res={killed:[],bitten:[],saved:false,msgs:[]};
 for(const p of pl()){p.shield=null;p.plan=null;p.shot=null;p.gd=p.hl=p.lt=null;p.insp=false;p.pauseT=0;if(p.alive&&p.bot){const h=HOUSES[p.hi];goPath(p,[h.dout,h.din,[h.cx,h.cy]],2)}}}
// мутации открываются не сразу: каждый рассвет маньяк может получить одну новую
function grantMut(){for(const m of pl()){if(m.role!=='murderer'||!m.alive)continue;m.mu=m.mu||{};
 for(const k of shuffle(MUTK.filter(q=>!m.mu[q])))if(Math.random()*100<(settings.mut[k]||0)){m.mu[k]=true;sendTo(m.id,{t:'mu',mu:m.mu,nw:k});break}}}
function tick(){
 const dt=1/30;S.t-=dt;
 for(const p of pl()){if(!p.alive)continue;
  for(const k of ['cd','cdI','cdL','atkT','slowT','frT','invT','dashT'])if(p[k]>0)p[k]=Math.max(0,p[k]-dt);
  let moving=false;
  if(p.pauseT>0){p.pauseT-=dt;
   if(p.pauseT<=0&&S.ph==='night'&&p.vh!==undefined){const mh=HOUSES[p.hi],vh=HOUSES[p.vh];goPath(p,[vh.din,vh.dout,mh.dout,mh.din,[mh.cx,mh.cy]],2)}}
  else if(p.path&&p.path.length){moving=true;
   const q=p.path[0],dx=q[0]-p.x,dy=q[1]-p.y,d=Math.hypot(dx,dy),sp=((p.after===5||p.after===7)?huntSp():settings.speed)*dt;
   if(d<=sp){p.x=q[0];p.y=q[1];p.path.shift();if(!p.path.length){if(p.after===5){strike(p);p.pauseT=1.6}else if(p.after===7)duelResolve()}}
   else{p.x+=dx/d*sp;p.y+=dy/d*sp;p.fa=Math.atan2(dy,dx)}}
  else if(phase==='play'&&S.ph!=='duel'&&((p.in&&(p.in.x||p.in.y))||p.dashT>0)){
   let sp=settings.speed*(p.slowT>0?.55:1),vx=p.in?p.in.x:0,vy=p.in?p.in.y:0;const mu=p.mu||{};
   if(p.role==='murderer'){if(mu.shadow&&S.ph==='night')sp*=1.45;if(p.frT>0)sp*=1.4}
   if(p.dashT>0){vx=Math.cos(p.fa||0);vy=Math.sin(p.fa||0);sp*=3.8}
   const nx=p.x+vx*sp*dt,ny=p.y+vy*sp*dt;if(!blocked(nx,p.y,R_P))p.x=nx;if(!blocked(p.x,ny,R_P))p.y=ny;moving=true}
  const h=HOUSES[p.hi];let st;
  if(p.pauseT>0||p.atkT>0)st=5;
  else if(moving)st=(p.role==='murderer'&&(S.ph==='night'||S.ph==='duel'))?4:0;
  else if(S.ph==='day'&&Math.hypot(p.x-FIRE[0],p.y-FIRE[1])<175)st=1;
  else if(S.ph==='night'&&h&&inHouse(p,h)&&Math.hypot(p.x-h.cx,p.y-h.cy)<50)st=2;
  else st=6;
  p.st=st;p.inv=p.invT>0;p.mk=p.role==='murderer'&&S.ph==='night'}
 if(S.ph==='night'&&S.stage==='plan'&&S.t<=S.nt0-PLAN)beginHunt();
 if(S.t<=0)endPhase();
 if(phase==='play')broadcast({t:'st',ph:S.ph,sg:S.stage,day:S.day,tl:S.t,p:pl().map(p=>[p.id,Math.round(p.x),Math.round(p.y),p.alive?1:0,p.st|0,p.hp|0,p.invT>0?1:0,Math.round((p.fa||0)*100),p.role==='murderer'&&S.ph==='night'?1:0])});
}
function endPhase(){
 if(S.ph==='duel'){if(!S.dr)duelResolve();else checkWin();return}
 if(S.ph==='day'){resolveVote();if(checkWin())return}
 else{finishNight();if(checkWin())return;S.day++;if(S.day>7){endGame('civ','Пережиты все 7 ночей');return}}
 {const al=pl().filter(p=>p.alive);if(al.length===2&&al.filter(p=>p.role==='murderer').length===1)return startDuel()}
 S.ph==='day'?startNight():startDay();
}
function beginHunt(){
 S.stage='act';const all=pl(),al=all.filter(p=>p.alive),d=all.find(p=>p.role==='doctor'),sh=all.find(p=>p.role==='sheriff');
 if(d&&d.alive&&d.bot&&!d.shield)d.shield=rand(al).id;
 for(const q of al){if(!q.bot)continue;if(q.role==='guard'&&!q.gd){const c=al.filter(z=>z!==q);if(c.length)q.gd=rand(c).id}if(q.role==='priest'&&!q.hl)q.hl=rand(al).id;if(q.role==='lamp'&&!q.lt)q.lt=rand(al).id}
 const pr=al.find(q=>q.role==='priest'&&q.hl);if(pr&&players[pr.hl]&&players[pr.hl].alive)players[pr.hl].hp=100;
 if(sh&&sh.alive&&sh.bot&&!sh.shot&&Math.random()<.3){const c=al.filter(q=>q!==sh);if(c.length)sh.shot=rand(c).id}
 if(sh&&sh.alive&&sh.shot){const v=players[sh.shot];
  if(v&&v.alive){fxAll({k:'shot',x:sh.x,y:sh.y,x2:v.x,y2:v.y});die(v);
   if(v.role==='murderer')S.res.msgs.push('🔫 Шериф застрелил маньяка!');else{die(sh);S.res.msgs.push('🔫 Шериф застрелил мирного — погибли оба: '+sh.nick+' и '+v.nick)}}
  if(checkWin())return}
 for(const m of al)if(m.bot&&m.role==='murderer'&&m.alive){const c=al.filter(q=>q.alive&&q.role!=='murderer');
  if(c.length){const v=rand(c),mh=HOUSES[m.hi],vh=HOUSES[v.hi];m.plan={t:[v.id]};m.vh=v.hi;
   goPath(m,(inHouse(m,mh)?[mh.din,mh.dout]:[mh.dout]).concat([vh.dout,vh.din,[vh.cx,vh.cy]]),5)}}
}
function hurt(m,v,dmg){
 const d=pl().find(q=>q.role==='doctor'),lp=pl().find(q=>q.role==='lamp'&&q.alive&&q.lt===v.id),gu=pl().find(q=>q.role==='guard'&&q.alive&&q.gd===v.id&&q!==v);
 if(lp)sendTo(lp.id,{t:'insp',id:m.id,role:'murderer'});
 if(gu){gu.hp-=dmg;if(gu.hp<=0){die(gu);S.res.killed.push(gu)}S.res.msgs.push('🛡 Страж принял удар вместо жертвы');return false}
 if(d&&d.alive&&d.shield===v.id){S.res.saved=true;return false}
 v.hp-=dmg;if(v.hp<=0){die(v);S.res.killed.push(v);return true}
 S.res.bitten.push(v);return false}
// удар маньяка: бьёт ближайшего мирного в радиусе; мутации улучшают удар
function strike(p){
 if((p.cd||0)>0||!S.res)return false;
 const near=pl().filter(q=>q.alive&&q.role!=='murderer'&&d2(q,p)<=75).sort((a,b)=>d2(a,p)-d2(b,p));
 const v=(p.plan&&near.find(q=>q.id===p.plan.t[0]))||near[0];
 p.cd=2.5;p.atkT=.6;if(!v)return false;
 const mu=p.mu||{};fxAll({k:'slash',x:v.x,y:v.y});
 const dead=hurt(p,v,100);
 if(mu.snake){const ex=pl().filter(q=>q.alive&&q.role!=='murderer'&&q!==v&&d2(q,v)<=140).slice(0,2);ex.forEach(q=>hurt(p,q,30));if(ex.length)fxAll({k:'snake',x:v.x,y:v.y,to:ex.map(q=>[q.x,q.y])})}
 if(mu.venom)pl().filter(q=>q.alive&&q.role!=='murderer'&&d2(q,p)<170).forEach(q=>{q.slowT=10});
 if(dead&&mu.vamp)p.frT=8;
 return true}
function finishNight(){
 const R=S.res||{killed:[],bitten:[],saved:false,msgs:[]};
 for(const m of pl())if(m.bot&&m.role==='murderer'&&m.alive&&((m.path&&m.path.length)||m.pauseT>0)){const h=HOUSES[m.hi];m.x=h.cx;m.y=h.cy;m.path=[];m.pauseT=0}
 R.killed.forEach(v=>fxAll({k:'msg',m:'☠ '+v.nick+' найден(а) мёртвым(ой)'}));
 if(R.bitten.length)fxAll({k:'msg',m:'🐍 Ночью кого-то укусила змея…'});
 if(R.saved)fxAll({k:'msg',m:'🛡 Доктор спас кого-то от нападения'});
 R.msgs.forEach(t=>fxAll({k:'msg',m:t}));
 if(!R.killed.length&&!R.bitten.length&&!R.saved&&!R.msgs.length)fxAll({k:'msg',m:'🌅 Ночь прошла тихо'});
 S.res=null;
}
// ---- финальная дуэль: маньяк идёт к последнему выжившему, тот не может сбежать
function startDuel(){
 const m=pl().find(p=>p.role==='murderer'&&p.alive),v=pl().find(p=>p.alive&&p.role!=='murderer');
 S.ph='duel';S.stage='act';S.t=30;S.dr=false;G.choice={};
 for(const p of pl())if(p.alive){p.path=[];p.pauseT=0;if(p!==m)p.in={x:0,y:0}}
 const mh=HOUSES[m.hi],vh=HOUSES[v.hi];
 if(m.st===2&&v.st===2)goPath(m,[mh.din,mh.dout,vh.dout,vh.din,[vh.cx-40,vh.cy]],7);else goPath(m,[[v.x-28,v.y]],7);
 fxAll({k:'msg',m:'⚔ Финальная дуэль: маньяк идёт к последнему выжившему'});
}
function duelResolve(){
 if(S.dr)return;S.dr=true;S.t=2.5;
 const m=pl().find(p=>p.role==='murderer'&&p.alive),v=pl().find(p=>p.alive&&p.role!=='murderer');if(!v||!m)return;
 m.path=[];m.atkT=.6;
 if(v.role==='sheriff'&&Math.random()<.5){fxAll({k:'shot',x:v.x,y:v.y,x2:m.x,y2:m.y});die(m);fxAll({k:'msg',m:'🔫 Шериф успел выстрелить первым!'})}
 else{fxAll({k:'slash',x:v.x,y:v.y});die(v);fxAll({k:'msg',m:'🗡 Маньяк настиг последнего выжившего'})}
}

function sendTo(id,m){if(id===me.id)clientMsg(m);else{const p=players[id];if(p&&p.conn&&p.conn.open)p.conn.send(m)}}
function fxAll(o){addFx(o);broadcast(Object.assign({t:'fx'},o))}
function die(p,exiled){p.alive=false;p.hp=0;p.path=[];p.st=exiled?3:2}
function resolveVote(){
 const al=pl().filter(p=>p.alive),tally={};
 for(const p of al){let v=p.vote;if(p.bot){const c=al.filter(q=>q!==p);v=Math.random()<.25||!c.length?'skip':rand(c).id}
  if(v==='skip'||(v&&players[v]&&players[v].alive))tally[v]=(tally[v]||0)+1}
 const e=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
 if(!e.length||e[0][0]==='skip'||(e[1]&&e[1][1]===e[0][1])){fxAll({k:'msg',m:'⚖ Голосование пропущено или голоса разделились — никого не изгнали'});return}
 const v=players[e[0][0]];die(v,true);fxAll({k:'msg',m:`⚖ Изгнан ${v.nick} — это был ${RN[v.role]}`});
 if(v.role==='jester')endGame('jester','Шута изгнали голосованием');
}
function applyAct(id,d){
 const p=players[id];if(!p||!p.alive||phase!=='play')return;const ok=t=>players[t]&&players[t].alive,night=S.ph==='night',plan=night&&S.stage==='plan';
 if(d.k==='skipnow'){if(id===hostId&&S.ph==='day')S.t=0}
 else if(d.k==='vote'&&S.ph==='day'&&S.t<=settings.time-VDELAY&&(d.to==='skip'||(ok(d.to)&&d.to!==id))){p.vote=d.to;
  if(pl().filter(q=>q.alive&&!q.bot).every(q=>q.vote))S.t=Math.min(S.t,1.5)}
 else if(d.k==='shield'&&plan&&p.role==='doctor'&&ok(d.to))p.shield=d.to;
 else if(d.k==='shoot'&&plan&&p.role==='sheriff')p.shot=d.to&&ok(d.to)&&d.to!==id?d.to:null;
 else if(d.k==='guard'&&plan&&p.role==='guard'&&ok(d.to)&&d.to!==id)p.gd=d.to;
 else if(d.k==='heal'&&plan&&p.role==='priest'&&ok(d.to))p.hl=d.to;
 else if(d.k==='light'&&plan&&p.role==='lamp'&&ok(d.to))p.lt=d.to;
 else if(d.k==='inspect'&&plan&&p.role==='detective'&&!p.insp&&ok(d.to)&&d.to!==id){p.insp=true;sendTo(id,{t:'insp',id:d.to,role:players[d.to].role})}
 else if(d.k==='strike'&&p.role==='murderer'&&night&&S.stage==='act'&&!(p.path&&p.path.length))strike(p);
 else if(d.k==='invis'&&p.role==='murderer'&&night&&(p.mu||{}).invis&&!(p.cdI>0)){p.invT=6;p.cdI=25}
 else if(d.k==='dash'&&p.role==='murderer'&&night&&(p.mu||{}).leap&&!(p.cdL>0)){p.dashT=.28;p.cdL=10}
}
function sendAct(d){if(isHost)applyAct(me.id,d);else if(hostConn&&hostConn.open)hostConn.send(Object.assign({t:'act'},d))}
function checkWin(){
 if(phase!=='play')return true;const all=pl();
 if(!all.some(p=>p.role==='murderer'&&p.alive)){endGame('civ',all.some(p=>p.role==='murderer')?'Маньяк обезврежен':'Маньяк покинул игру');return true}
 if(!all.some(p=>p.role!=='murderer'&&p.alive)){endGame('murderer','Все мирные жители мертвы');return true}
 return false}
function endGame(w,reason){
 if(phase!=='play')return;phase='lobby';clearInterval(loop);loop=null;log('Конец игры:',w);
 const roles={};for(const p of pl())roles[p.id]=p.role;
 broadcast({t:'end',w,reason,roles});showEnd(w,reason);setTimeout(broadcastLobby,100);
}
function showEnd(w,reason){

 T.fire.intensity=lerp(.9,2.1,nf)*fl;T.fire.color.set(M==='aquarium'?0x58a8ff:M==='bunker'?0xffe8b0:0xff8a3a);

 T.flames.forEach((f,i)=>{if(f.userData.h){const s=1+.18*Math.sin(now/90+i*2)+.08*Math.sin(now/37+i);f.scale.set(s*(1+.1*Math.sin(now/110+i)),s,s)}else f.scale.setScalar(1+.08*Math.sin(now/200+i))});
 const alive=list.filter(p=>p.alive);
 T.doors.forEach(d=>{const near=alive.some(p=>Math.hypot(p.x-d.c[0],p.y-d.c[1])<66);d.v+=((near?1:0)-d.v)*Math.min(1,dt*6);d.pv.rotation.y=d.base+d.dir*d.v*1.75});
 HOUSES.forEach((h,i)=>{const r=T.roofs[i];if(r)r.visible=!(spec||inHouse(m,h))});

 else if(fp){cam.position.set(m.x,36,m.y);const cp=Math.cos(camPitch);cam.lookAt(m.x+Math.cos(camYaw)*cp*100,36+Math.sin(camPitch)*100,m.y+Math.sin(camYaw)*cp*100)}
 else{const e=clamp(.42-camPitch*.8,.08,1.25),D=camDist;cam.position.set(m.x-Math.cos(camYaw)*Math.cos(e)*D,26+Math.sin(e)*D,m.y-Math.sin(camYaw)*Math.cos(e)*D);cam.lookAt(m.x,32,m.y)}
 // оружие от первого лица

  T.beam=new THREE.Mesh(new THREE.CylinderGeometry(3,3,110,8),new THREE.MeshBasicMaterial({color:0xffc060,transparent:true,opacity:.28,depthTest:false}));sc.add(T.beam)}
 const showA=!!NAV&&inPlay&&m.alive;T.arrow.visible=T.ring.visible=T.beam.visible=showA;

 for(const p of list){if(p.wasAlive&&!p.alive)FX.push({k:'soul',x:p.x,y:p.y,t0:performance.now()});p.wasAlive=p.alive;
